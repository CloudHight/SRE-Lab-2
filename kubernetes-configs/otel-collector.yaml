apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: observability
spec:
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_binary:
            endpoint: 0.0.0.0:6832
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_http:
            endpoint: 0.0.0.0:14268
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              static_configs:
                - targets: ['0.0.0.0:8888']
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1000
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      resourcedetection:
        detectors: [eks]
        timeout: 2s
    
    exporters:
      prometheusremotewrite:
        endpoint: "${AMP_ENDPOINT_URL}api/v1/remote_write"
        aws_auth:
          region: us-east-1
          service: "aps"
      awsxray:
        region: us-east-1
      logging:
        loglevel: debug
      loki:
        endpoint: http://loki-gateway:80/loki/api/v1/push
        labels:
          resource:
            - k8s.cluster.name
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
    
    service:
      pipelines:
        traces:
          receivers: [otlp, jaeger]
          processors: [batch, memory_limiter, resourcedetection]
          exporters: [awsxray]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch, memory_limiter, resourcedetection]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [batch, memory_limiter, resourcedetection]
          exporters: [loki]
  mode: deployment
  serviceAccount: amp-service-account