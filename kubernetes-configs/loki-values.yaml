loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: 's3'
    bucketNames:
      chunks: observability-loki-chunks8
      ruler: observability-loki-ruler8
      admin: observability-loki-admin8
    s3:
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1
      s3ForcePathStyle: false
      insecure: false
  schemaConfig:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: aws
        schema: v11
        index:
          prefix: index_
          period: 24h
promtail:
  enabled: true
  config:
    serverPort: 3101
    clients:
      - url: http://loki-gateway/loki/api/v1/push
gateway:
  enabled: true
  service:
    type: LoadBalancer