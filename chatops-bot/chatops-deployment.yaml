apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-bot
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatops-bot
  template:
    metadata:
      labels:
        app: chatops-bot
    spec:
      containers:
      - name: chatops-bot
        image: <YOUR_CHATOPS_IMAGE>
        env:
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-credentials
              key: SLACK_BOT_TOKEN
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: slack-credentials
              key: SLACK_SIGNING_SECRET
        - name: SLACK_CHANNEL_ID
          valueFrom:
            secretKeyRef:
              name: slack-credentials
              key: SLACK_CHANNEL_ID
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: API_KEY
        - name: REDIS_HOST
          value: "redis-master.observability.svc.cluster.local"
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: chatops-bot
  namespace: observability
spec:
  selector:
    app: chatops-bot
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP